<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      color: #e6e6e6;
      font-family: 'JetBrains Mono', monospace;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Кнопка управления треком LEMMiNO - Cipher (правый верхний угол) */
    #soundToggle {
      position: fixed;
      top: 18px;
      right: 22px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #555555;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
      z-index: 10;
    }

    #soundToggle:hover {
      color: #e6e6e6;
    }

    /* Постоянный счётчик введённых букв/цифр (правый нижний угол) */
    #charCounter {
      position: fixed;
      bottom: 18px;
      right: 22px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #4d4d4d;
      user-select: none;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    #charCounter.active {
      color: #a6a6a6;
    }
  </style>
</head>
<body>

  <!-- Положи cICADA2.jpg и cipher.mp3 (LEMMiNO - Cipher) в корень репозитория -->
  <img id="cipherImg" src="cICADA2.jpg" alt="...">
  
  <div id="soundToggle">[ SOUND: OFF ]</div>
  <div id="charCounter">00 / 34</div>

  <audio id="bgMusic" src="cipher.mp3" loop preload="auto"></audio>

  <script>
    // === 1. ЗАГРУЗКА КАРТИНКИ ===
    (function loadCipherImage() {
      const img = document.getElementById("cipherImg");
      const candidates = ["cicada2.jpg", "CICADA2.jpg", "cICADA2.JPG", "cICADA2.png", "Cicada_2.png"];
      let idx = 0;
      img.onerror = function() {
        if (idx < candidates.length) img.src = candidates[idx++];
      };
    })();

    document.addEventListener("contextmenu", e => e.preventDefault());

    // === 2. УПРАВЛЕНИЕ МУЗЫКОЙ (LEMMiNO - Cipher) ===
    (function initAudio() {
      const audio = document.getElementById("bgMusic");
      const toggle = document.getElementById("soundToggle");
      audio.volume = 0.35;
      let userMuted = false;

      function playAudio() {
        if (userMuted || !audio.paused) return;
        audio.play().then(() => {
          toggle.textContent = "[ SOUND: ON ]";
          toggle.style.color = "#888888";
        }).catch(() => {});
      }

      // Автоматический старт при первом клике или нажатии клавиши
      window.addEventListener("click", playAudio, { once: true });
      window.addEventListener("keydown", playAudio, { once: true });

      // Ручное переключение
      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) {
          userMuted = false;
          audio.play().then(() => {
            toggle.textContent = "[ SOUND: ON ]";
            toggle.style.color = "#888888";
          });
        } else {
          userMuted = true;
          audio.pause();
          toggle.textContent = "[ SOUND: OFF ]";
          toggle.style.color = "#555555";
        }
      });
    })();

    // === 3. НАВИГАЦИЯ ===
    function goToPage(filename) {
      const url = new URL(window.location.href);
      if (url.pathname.endsWith(".html")) {
        url.pathname = url.pathname.replace(/[^/]+$/, filename);
      } else {
        if (!url.pathname.endsWith("/")) url.pathname += "/";
        url.pathname += filename;
      }
      window.location.href = url.toString();
    }

    // === 4. ПРОВЕРКА ОТВЕТА И СЧЁТЧИК СИМВОЛОВ: "butterflydownontheboatcemetery2012" ===
    (function stage1Listener() {
      const TARGET_CODES = [
        "KeyB","KeyU","KeyT","KeyT","KeyE","KeyR","F","L","Y",
        "KeyD","KeyO","KeyW","KeyN",
        "KeyO","KeyN",
        "KeyT","KeyH","KeyE",
        "KeyB","KeyO","KeyA","KeyT",
        "KeyC","KeyE","KeyM","KeyE","KeyT","KeyE","KeyR","KeyY",
        "Digit2","Digit0","Digit1","Digit2"
      ].map(c => c.length === 1 ? "Key" + c : c);

      let buffer = [];
      let glowTimer = null;
      const counterEl = document.getElementById("charCounter");

      function updateCounter(customText) {
        if (customText) {
          counterEl.textContent = customText;
        } else {
          const current = String(buffer.length).padStart(2, "0");
          const total = String(TARGET_CODES.length).padStart(2, "0");
          counterEl.textContent = `${current} / ${total}`;
        }

        counterEl.classList.add("active");
        clearTimeout(glowTimer);
        glowTimer = setTimeout(() => {
          counterEl.classList.remove("active");
        }, 600);
      }

      window.addEventListener("keydown", (e) => {
        // Сброс ввода по Escape
        if (e.code === "Escape") {
          buffer = [];
          updateCounter("00 / 34");
          return;
        }

        // Удаление последнего символа по Backspace
        if (e.code === "Backspace") {
          buffer.pop();
          updateCounter();
          return;
        }

        // Учитываем только буквы и цифры (игнорируем пробелы, запятые, дефисы)
        const isLetter = e.code.startsWith("Key");
        const isDigit = e.code.startsWith("Digit");
        if (!isLetter && !isDigit) return;

        buffer.push(e.code);
        if (buffer.length > TARGET_CODES.length) {
          buffer.shift();
        }

        updateCounter();

        // Проверка совпадения
        if (buffer.length === TARGET_CODES.length && buffer.join(",") === TARGET_CODES.join(",")) {
          counterEl.textContent = "34 / 34 [OK]";
          counterEl.style.color = "#ffffff";
          document.body.style.backgroundColor = "#ffffff";
          setTimeout(() => {
            goToPage("stage2.html");
          }, 220);
        }
      });
    })();

    // === 5. ЗАЩИТА КОНСОЛИ (F12) ===
    (function antiInspect() {
      const bannerStyle = "color: #ff3b3b; background: #0a0a0a; font-size: 16px; font-weight: 600; font-family: 'JetBrains Mono', monospace; padding: 12px 16px; border: 1px solid #ff3b3b;";
      function printWarning() {
        console.clear();
        console.log("%cThere is nothing in there, try to think >:0", bannerStyle);
      }
      printWarning();
      let devtoolsOpen = false;
      setInterval(() => {
        const isOpen = window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160;
        if (isOpen && !devtoolsOpen) { devtoolsOpen = true; printWarning(); }
        else if (!isOpen) { devtoolsOpen = false; }
      }, 800);
    })();
  </script>

</body>
</html>
