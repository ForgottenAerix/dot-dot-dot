<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>

  <!-- Картинка должна лежать внутри папки begin/ под именем 01.png -->
  <img src="01.png" alt="...">

  <script>
    // Запрет правого клика по картинке
    document.addEventListener("contextmenu", e => e.preventDefault());

    // Переход на 2-й этап, если игрок напечатает на клавиатуре слово "player"
    (function nextStageListener() {
      let codeBuffer = [];
      const TARGET_SEQ = "KeyP,KeyL,KeyA,KeyY,KeyE,KeyR";

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.key.length > 1) return;
        codeBuffer.push(e.code);
        if (codeBuffer.length > 6) codeBuffer.shift();

        if (codeBuffer.join(",") === TARGET_SEQ) {
          document.body.style.backgroundColor = "#ffffff";
          setTimeout(() => {
            window.location.href = "../player/";
          }, 150);
        }
      });
    })();

    // Защита консоли (F12)
    (function antiInspect() {
      const bannerStyle = "color: #ff3333; background: #111111; font-size: 18px; font-weight: bold; font-family: 'Courier New', monospace; padding: 12px 16px; border: 1px solid #ff3333;";
      function printWarning() {
        console.clear();
        console.log("%cThere is nothing in there, try to think >:0", bannerStyle);
      }
      printWarning();
      let devtoolsOpen = false;
      setInterval(() => {
        const isOpen = window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160;
        if (isOpen && !devtoolsOpen) { devtoolsOpen = true; printWarning(); }
        else if (!isOpen) { devtoolsOpen = false; }
      }, 800);
    })();
  </script>

</body>
</html>
