<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .text {
      font-size: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="text">Think wider. This is dumb.</div>

  <script>
    (function antiInspect() {
      const bannerStyle = "color: #ff3333; background: #111; font-size: 18px; font-weight: bold; font-family: monospace; padding: 12px 16px; border: 1px solid #ff3333;";
      function printWarning() {
        console.clear();
        console.log("%cThere is nothing in there, try to think >:0", bannerStyle);
      }
      printWarning();
      setInterval(() => {
        if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
          printWarning();
        }
      }, 800);
    })();
  </script>
